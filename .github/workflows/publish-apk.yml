name: Build and Publish DakhlOKharj APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ci/dakhlokharj/v021_source.tar.xz.b64'
      - '.github/workflows/publish-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct DakhlOKharj v0.2.1 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dakhlokharj
          base64 -d ci/dakhlokharj/v021_source.tar.xz.b64 > /tmp/dakhlokharj-v021.tar.xz
          tar -xJf /tmp/dakhlokharj-v021.tar.xz -C .
          test -f dakhlokharj/settings.gradle.kts
          test -f dakhlokharj/app/build.gradle.kts
          test -f dakhlokharj/app/src/main/AndroidManifest.xml
          test -f dakhlokharj/app/src/main/res/drawable/ic_launcher_dakhlokharj.png
          grep -q 'versionName = "0.2.1"' dakhlokharj/app/build.gradle.kts
          echo "DakhlOKharj v0.2.1 source verified."
          python3 ci/dakhlokharj/patch-v021.py
          echo "Jalali report patch applied."

      - name: Use Android 36 compatible build versions
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/compileSdk = 37/compileSdk = 36/' dakhlokharj/app/build.gradle.kts
          sed -i 's/version "9.4.0"/version "9.2.0"/' dakhlokharj/build.gradle.kts
          sed -i 's/compose-bom:2026.09.00/compose-bom:2025.12.00/' dakhlokharj/app/build.gradle.kts
          sed -i 's/activity-compose:1.13.0/activity-compose:1.12.2/' dakhlokharj/app/build.gradle.kts
          sed -i 's/lifecycle-runtime-ktx:2.11.0/lifecycle-runtime-ktx:2.10.0/' dakhlokharj/app/build.gradle.kts
          sed -i 's/lifecycle-viewmodel-compose:2.11.0/lifecycle-viewmodel-compose:2.10.0/' dakhlokharj/app/build.gradle.kts
          sed -i 's/navigation-compose:2.10.0/navigation-compose:2.9.6/' dakhlokharj/app/build.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        working-directory: dakhlokharj
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find dakhlokharj/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p releases
          cp "$APK" releases/DakhlOKharj-MVP-debug.apk
          sha256sum releases/DakhlOKharj-MVP-debug.apk > releases/DakhlOKharj-MVP-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DakhlOKharj-v0.2.1-debug
          path: |
            releases/DakhlOKharj-MVP-debug.apk
            releases/DakhlOKharj-MVP-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/DakhlOKharj-MVP-debug.apk releases/DakhlOKharj-MVP-debug.apk.sha256
          if git diff --cached --quiet; then
            echo "APK is already current."
          else
            git commit -m "Publish DakhlOKharj v0.2.1 APK"
            git push
          fi
