name: Publish APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-apk.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact ZIP
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprukwest.oaiusercontent.com/files/00000000-3fc0-8243-94ac-bdc9c1af8465/raw?se=2026-09-19T17%3A11%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=795a0968-1a95-5cab-ae7d-5d08b1bd093f&skoid=002823aa-689d-47ca-9347-108c20f4f00d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T05%3A57%3A05Z&ske=2026-09-20T05%3A57%3A05Z&sks=b&skv=2026-02-06&sig=wpVi1fsC0vxA2FzeBYooygPMulEUxzlmK%2Bs%2BM1ul96E%3D' -o /tmp/apk.zip
          mkdir -p /tmp/apk
          unzip -o /tmp/apk.zip -d /tmp/apk
          APK=$(find /tmp/apk -type f -name '*.apk' | head -1)
          test -n "$APK"
          mkdir -p releases
          cp "$APK" releases/DakhlOKharj-MVP-debug.apk
          sha256sum releases/DakhlOKharj-MVP-debug.apk > releases/DakhlOKharj-MVP-debug.apk.sha256

      - name: Commit public APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/
          if git diff --cached --quiet; then
            echo "APK already up to date"
          else
            git commit -m "Publish DakhlOKharj APK"
            git push
          fi
