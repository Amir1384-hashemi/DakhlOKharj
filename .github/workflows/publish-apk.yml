name: Build and Publish DakhlOKharj APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ci/dakhlokharj/**'
      - '.github/workflows/publish-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct DakhlOKharj source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, io, zipfile

          root = Path("ci/dakhlokharj")
          prefix = "".join((root / n).read_text() for n in [
              "source.part1.b64", "source.part2.b64", "source.part3.b64", "source.part4.b64"
          ])
          suspect = (root / "source.part5a1.b64").read_text()
          suffix = "".join((root / n).read_text() for n in [
              "source.part5a2.b64", "source.part5b.b64", "source.part5c.b64",
              "source.part6a.b64", "source.part6b.b64", "source.part6c.b64",
              "source.part7a.b64", "source.part7b1.b64", "source.part7b2.b64", "source.part7c.b64"
          ])

          required = {
              "dakhlokharj/settings.gradle.kts",
              "dakhlokharj/app/build.gradle.kts",
              "dakhlokharj/app/src/main/AndroidManifest.xml",
              "dakhlokharj/app/src/main/res/drawable/ic_launcher_dakhlokharj.webp",
          }

          archive = None
          removed = None
          for i in range(len(suspect)):
              text = prefix + suspect[:i] + suspect[i+1:] + suffix
              try:
                  raw = base64.b64decode(text, validate=True)
                  with zipfile.ZipFile(io.BytesIO(raw)) as zf:
                      if zf.testzip() is None and required.issubset(set(zf.namelist())):
                          archive = raw
                          removed = i
                          break
              except Exception:
                  pass

          if archive is None:
              raise SystemExit("Could not reconstruct a valid source archive.")

          Path("/tmp/dakhlokharj-source.zip").write_bytes(archive)
          print(f"Source archive reconstructed; ignored one transfer character at offset {removed}.")
          with zipfile.ZipFile(io.BytesIO(archive)) as zf:
              zf.extractall(".")
          PY
          test -f dakhlokharj/settings.gradle.kts
          test -f dakhlokharj/app/build.gradle.kts
          test -f dakhlokharj/app/src/main/res/drawable/ic_launcher_dakhlokharj.webp

      - name: Use Android 36 compatible build versions
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/compileSdk = 37/compileSdk = 36/' dakhlokharj/app/build.gradle.kts
          sed -i 's/version "9.4.0"/version "9.2.0"/' dakhlokharj/build.gradle.kts
          sed -i 's/compose-bom:2026.09.00/compose-bom:2025.12.00/' dakhlokharj/app/build.gradle.kts
          sed -i 's/activity-compose:1.13.0/activity-compose:1.12.2/' dakhlokharj/app/build.gradle.kts
          sed -i 's/lifecycle-runtime-ktx:2.11.0/lifecycle-runtime-ktx:2.10.0/' dakhlokharj/app/build.gradle.kts
          sed -i 's/lifecycle-viewmodel-compose:2.11.0/lifecycle-viewmodel-compose:2.10.0/' dakhlokharj/app/build.gradle.kts
          sed -i 's/navigation-compose:2.10.0/navigation-compose:2.9.6/' dakhlokharj/app/build.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        working-directory: dakhlokharj
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find dakhlokharj/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p releases
          cp "$APK" releases/DakhlOKharj-MVP-debug.apk
          sha256sum releases/DakhlOKharj-MVP-debug.apk > releases/DakhlOKharj-MVP-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DakhlOKharj-v0.2.1-debug
          path: |
            releases/DakhlOKharj-MVP-debug.apk
            releases/DakhlOKharj-MVP-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/DakhlOKharj-MVP-debug.apk releases/DakhlOKharj-MVP-debug.apk.sha256
          if git diff --cached --quiet; then
            echo "APK is already current."
          else
            git commit -m "Publish DakhlOKharj v0.2.1 APK"
            git push
          fi
