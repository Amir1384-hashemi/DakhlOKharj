name: Engineering Calculator | paid-store candidate QA
on:
  push:
    branches: [engineering-calculator-paid-rc]
    paths:
      - 'ci/engineering-calculator-store/**'
      - '.github/workflows/engineering-calculator-store-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-release-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_DIR: omranyar_flutter
    steps:
      - uses: actions/checkout@v4
      - name: Restore last-tested Flutter source
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR"
          base64 -d ci/omranyar-beta/source.tar.xz.b64 | tar -xJ -C "$BUILD_DIR"
          base64 -d ci/omranyar-beta/truss_patch.tar.xz.b64 | tar -xJ -C "$BUILD_DIR"
          cp ci/omranyar-beta/qa_regression_test.dart "$BUILD_DIR/test/qa_regression_test.dart"
          cp ci/omranyar-beta/qa_ui_smoke_test.dart "$BUILD_DIR/test/qa_ui_smoke_test.dart"
          python3 ci/omranyar-beta/qa_math_fixes.py
          python3 ci/engineering-calculator-store/apply_brand.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project, set app label and icon
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          flutter create --org ir.omranyar --platforms=android --project-name omran_yar .
          python3 tools/apply_branding.py
          cd ..
          python3 ci/engineering-calculator-store/set_paid_application_id.py
          cd "$BUILD_DIR"
          grep -q 'android:label="ماشین حساب مهندسی"' android/app/src/main/AndroidManifest.xml
          grep -q 'version: 1.0.0+10' pubspec.yaml
      - name: Install dependencies and lint
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          flutter pub add --dev flutter_lints
          flutter pub get
          flutter analyze --no-fatal-infos
      - name: Run scientific, civil engineering and UI tests
        working-directory: ${{ env.BUILD_DIR }}
        run: flutter test --reporter expanded
      - name: Dry-run production signing using throwaway QA-only key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          qa_tmpdir="$(mktemp -d)"
          qa_key="$qa_tmpdir/staging-signing.p12"
          qa_password="$(openssl rand -hex 24)"
          trap 'rm -rf "$qa_tmpdir"' EXIT
          keytool -genkeypair -noprompt -keystore "$qa_key" -storetype PKCS12 \
            -storepass "$qa_password" -keypass "$qa_password" \
            -alias paid-store-staging-key -keyalg RSA -keysize 3072 -validity 365 \
            -dname 'CN=Temporary CI Test Key,OU=QA,O=EngineeringCalculator,C=IR' >/dev/null 2>&1
          export ENGINEERING_CALCULATOR_KEYSTORE_BASE64="$(base64 -w 0 "$qa_key")"
          export ENGINEERING_CALCULATOR_KEYSTORE_PASSWORD="$qa_password"
          python3 ci/engineering-calculator-store/configure_signing.py
          unset ENGINEERING_CALCULATOR_KEYSTORE_BASE64 ENGINEERING_CALCULATOR_KEYSTORE_PASSWORD
          unset ENGINEERING_CALCULATOR_KEY_ALIAS ENGINEERING_CALCULATOR_KEY_PASSWORD
      - name: Build signed staging APK and AAB
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Verify staging artifacts, identities, signatures and integrity
        shell: bash
        run: |
          set -euo pipefail
          APK="$BUILD_DIR/build/app/outputs/flutter-apk/app-release.apk"
          AAB="$BUILD_DIR/build/app/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)
          test -n "$APKSIGNER" && test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='ir.omranyar.engineeringcalculator' versionCode='10' versionName='1.0.0'"
          jarsigner -verify "$AAB"
          sha256sum "$APK" "$AAB"
      - name: Keep staging binaries as short-lived GitHub Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EngineeringCalculator-Staging-DoNotDistribute
          path: |
            omranyar_flutter/build/app/outputs/flutter-apk/app-release.apk
            omranyar_flutter/build/app/outputs/bundle/release/app-release.aab
          retention-days: 3
          if-no-files-found: error
