name: Build OmranYar Android beta

on:
  push:
    branches:
      - omranyar-android-beta
    paths:
      - 'ci/omranyar-beta/**'
      - '.github/workflows/build-omranyar-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_DIR: omranyar_flutter
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR"
          base64 -d ci/omranyar-beta/source.tar.xz.b64 | tar -xJ -C "$BUILD_DIR"
          test -s "$BUILD_DIR/lib/main.dart"
          test -s "$BUILD_DIR/pubspec.yaml"
          test -s "$BUILD_DIR/assets/branding/omran_yar_icon.png"
          echo "Flutter source recovered."
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project and apply brand
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          flutter create --org ir.omranyar --platforms=android --project-name omran_yar .
          python3 tools/apply_branding.py
      - name: Download dependencies
        working-directory: ${{ env.BUILD_DIR }}
        run: flutter pub get
      - name: Static analysis
        working-directory: ${{ env.BUILD_DIR }}
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        working-directory: ${{ env.BUILD_DIR }}
        run: flutter test --reporter expanded
      - name: Build release-mode APK
        working-directory: ${{ env.BUILD_DIR }}
        run: flutter build apk --release
      - name: Verify APK signature and record checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="$BUILD_DIR/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p releases/omranyar-beta
          cp "$APK" releases/omranyar-beta/OmranYar-Android-beta.apk
          (cd releases/omranyar-beta && sha256sum OmranYar-Android-beta.apk > SHA256SUMS.txt)
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmranYar-Android-Verified-Build
          path: releases/omranyar-beta/
          if-no-files-found: error
      - name: Publish APK directly on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/omranyar-beta/OmranYar-Android-beta.apk releases/omranyar-beta/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "APK already published"
          else
            git commit -m "Publish tested OmranYar beta APK"
            git push origin HEAD:omranyar-android-beta
          fi
