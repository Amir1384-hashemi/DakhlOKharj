name: Build Store Release
# rerun after keystore password refresh

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-store-release.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: /tmp/dakhlokharj-release.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

      - name: Reconstruct DakhlOKharj source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, io, zipfile

          root = Path("ci/dakhlokharj")
          def read(name):
              return (root / name).read_text()

          p2_original = read("source.part2.b64")
          text = "".join([
              read("source.part1.b64"),
              read("source.part2a1.b64"), read("source.part2a2.b64"), p2_original[3000:],
              read("source.part3.b64"), read("source.part4.b64"),
              read("source.part5a1.b64"), read("source.part5a2.b64"), read("source.part5b.b64"), read("source.part5c.b64"),
              read("source.part6a.b64"), read("source.part6b.b64"), read("source.part6c.b64"),
              read("source.part7a.b64"), read("source.part7b1.b64"), read("source.part7b2.b64"), read("source.part7c.b64"),
          ])
          raw = base64.b64decode(text, validate=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as zf:
              bad = zf.testzip()
              if bad is not None:
                  raise SystemExit(f"Corrupt archive member: {bad}")
              zf.extractall(".")
          PY
          python3 ci/dakhlokharj/patch-v021.py

      - name: Use Android 36 compatible versions
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/compileSdk = 37/compileSdk = 36/' dakhlokharj/app/build.gradle.kts
          sed -i 's/version "9.4.0"/version "9.2.0"/' dakhlokharj/build.gradle.kts
          sed -i 's/compose-bom:2026.09.00/compose-bom:2025.12.00/' dakhlokharj/app/build.gradle.kts
          sed -i 's/activity-compose:1.13.0/activity-compose:1.12.2/' dakhlokharj/app/build.gradle.kts
          sed -i 's/lifecycle-runtime-ktx:2.11.0/lifecycle-runtime-ktx:2.10.0/' dakhlokharj/app/build.gradle.kts
          sed -i 's/lifecycle-viewmodel-compose:2.11.0/lifecycle-viewmodel-compose:2.10.0/' dakhlokharj/app/build.gradle.kts
          sed -i 's/navigation-compose:2.10.0/navigation-compose:2.9.6/' dakhlokharj/app/build.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build unsigned Release APK and AAB
        working-directory: dakhlokharj
        run: gradle --no-daemon assembleRelease bundleRelease --stacktrace

      - name: Sign, verify, and collect store release
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED_APK=$(find dakhlokharj/app/build/outputs/apk/release -type f -name '*-unsigned.apk' | head -1)
          AAB=$(find dakhlokharj/app/build/outputs/bundle/release -type f -name '*.aab' | head -1)
          test -n "$UNSIGNED_APK"
          test -n "$AAB"

          mkdir -p store-release
          ALIGNED_APK=/tmp/DakhlOKharj-aligned.apk
          RELEASE_APK=store-release/DakhlOKharj-v0.2.3-release.apk
          RELEASE_AAB=store-release/DakhlOKharj-v0.2.3-release.aab

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign             --ks "$ANDROID_KEYSTORE_PATH"             --ks-key-alias "$ANDROID_KEY_ALIAS"             --ks-pass env:ANDROID_KEYSTORE_PASSWORD             --key-pass env:ANDROID_KEY_PASSWORD             --out "$RELEASE_APK"             "$ALIGNED_APK"

          cp "$AAB" "$RELEASE_AAB"
          jarsigner             -keystore "$ANDROID_KEYSTORE_PATH"             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -keypass "$ANDROID_KEY_PASSWORD"             "$RELEASE_AAB"             "$ANDROID_KEY_ALIAS"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$RELEASE_APK"
          jarsigner -verify -verbose -certs "$RELEASE_AAB" >/tmp/aab-verify.txt
          grep -q "jar verified" /tmp/aab-verify.txt

          sha256sum "$RELEASE_APK" "$RELEASE_AAB" > store-release/SHA256SUMS.txt

      - name: Upload store release
        uses: actions/upload-artifact@v4
        with:
          name: DakhlOKharj-v0.2.3-store-release
          path: store-release/*
          if-no-files-found: error
          retention-days: 30
