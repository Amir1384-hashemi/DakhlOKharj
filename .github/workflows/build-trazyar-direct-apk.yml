name: Build installable TrazYar APK
on:
  push:
    branches: [trazyar-direct-install]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Embed offline Persian comic voice recordings
        run: |
          mkdir -p TrazYarInstaller/app/src/main/res/raw
          curl -fLsS --retry 3 --retry-delay 2 --max-time 90 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/7fe5c0c4-daa7-4d1a-bcca-7e201045686f.mp3' -o 'TrazYarInstaller/app/src/main/res/raw/near_1.mp3'
          test "$(wc -c < 'TrazYarInstaller/app/src/main/res/raw/near_1.mp3')" -gt 4000
          curl -fLsS --retry 3 --retry-delay 2 --max-time 90 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/d5c85a75-2ee2-4b0e-860f-d8820f168dad.mp3' -o 'TrazYarInstaller/app/src/main/res/raw/near_2.mp3'
          test "$(wc -c < 'TrazYarInstaller/app/src/main/res/raw/near_2.mp3')" -gt 4000
          curl -fLsS --retry 3 --retry-delay 2 --max-time 90 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/6deed1e3-130d-4cec-814f-39ee6b77c552.mp3' -o 'TrazYarInstaller/app/src/main/res/raw/near_3.mp3'
          test "$(wc -c < 'TrazYarInstaller/app/src/main/res/raw/near_3.mp3')" -gt 4000
          curl -fLsS --retry 3 --retry-delay 2 --max-time 90 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/a4d9057d-5c6f-4471-8c4c-163dd62a8477.mp3' -o 'TrazYarInstaller/app/src/main/res/raw/near_4.mp3'
          test "$(wc -c < 'TrazYarInstaller/app/src/main/res/raw/near_4.mp3')" -gt 4000
          curl -fLsS --retry 3 --retry-delay 2 --max-time 90 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/42dcb448-9836-438c-a4a9-f624e0d8bc53.mp3' -o 'TrazYarInstaller/app/src/main/res/raw/far_1.mp3'
          test "$(wc -c < 'TrazYarInstaller/app/src/main/res/raw/far_1.mp3')" -gt 4000
          curl -fLsS --retry 3 --retry-delay 2 --max-time 90 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/31beac47-a626-4b2d-84e7-1a84f342659b.mp3' -o 'TrazYarInstaller/app/src/main/res/raw/far_2.mp3'
          test "$(wc -c < 'TrazYarInstaller/app/src/main/res/raw/far_2.mp3')" -gt 4000
          curl -fLsS --retry 3 --retry-delay 2 --max-time 90 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/021bb97c-1fe3-4ced-8cd1-6d5836d8a37f.mp3' -o 'TrazYarInstaller/app/src/main/res/raw/far_3.mp3'
          test "$(wc -c < 'TrazYarInstaller/app/src/main/res/raw/far_3.mp3')" -gt 4000
          curl -fLsS --retry 3 --retry-delay 2 --max-time 90 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/3628d59c-b257-4ad4-9458-20f53bdc0bde.mp3' -o 'TrazYarInstaller/app/src/main/res/raw/far_4.mp3'
          test "$(wc -c < 'TrazYarInstaller/app/src/main/res/raw/far_4.mp3')" -gt 4000
          curl -fLsS --retry 3 --retry-delay 2 --max-time 90 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/7b58aefb-20ed-4f1c-a46e-055bc46e7881.mp3' -o 'TrazYarInstaller/app/src/main/res/raw/success_1.mp3'
          test "$(wc -c < 'TrazYarInstaller/app/src/main/res/raw/success_1.mp3')" -gt 4000
          curl -fLsS --retry 3 --retry-delay 2 --max-time 90 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/f4ef33ef-c13a-47a8-b581-df50f73b6d4c.mp3' -o 'TrazYarInstaller/app/src/main/res/raw/success_2.mp3'
          test "$(wc -c < 'TrazYarInstaller/app/src/main/res/raw/success_2.mp3')" -gt 4000
          file TrazYarInstaller/app/src/main/res/raw/*.mp3
      - name: Build Android APK
        working-directory: TrazYarInstaller
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish downloadable APK on isolated branch
        run: |
          cp TrazYarInstaller/app/build/outputs/apk/debug/app-debug.apk TrazYar_Samsung_Funny_v1_4.apk
          test -s TrazYar_Samsung_Funny_v1_4.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f TrazYar_Samsung_Funny_v1_4.apk
          git commit -m "Publish installable TrazYar 1.4 humorous voices APK [skip ci]"
          git push origin HEAD:trazyar-direct-install
