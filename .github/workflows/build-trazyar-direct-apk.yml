name: Build installable TrazYar APK
on:
  push:
    branches: [trazyar-direct-install]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        working-directory: TrazYarInstaller
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish downloadable APK on isolated branch
        run: |
          cp TrazYarInstaller/app/build/outputs/apk/debug/app-debug.apk TrazYar_Samsung_v1_3.apk
          test -s TrazYar_Samsung_v1_3.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f TrazYar_Samsung_v1_3.apk
          git commit -m "Publish installable TrazYar 1.3 APK [skip ci]"
          git push origin HEAD:trazyar-direct-install
