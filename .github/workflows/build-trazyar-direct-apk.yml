name: Build installable TrazYar APK
on:
  push:
    branches: [trazyar-direct-install]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Embed 40 offline Persian humorous voice prompts
        run: |
          mkdir -p TrazYarInstaller/app/src/main/res/raw
          curl -fLsS --retry 3 --retry-delay 2 --max-time 90 'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/6cf19425-fe9d-423c-90d6-e297f51a472a.mp3' -o 'TrazYarInstaller/app/src/main/res/raw/kid_near_1.mp3'
          test "$(wc -c < 'TrazYarInstaller/app/src/main/res/raw/kid_near_1.mp3')" -gt 4000
