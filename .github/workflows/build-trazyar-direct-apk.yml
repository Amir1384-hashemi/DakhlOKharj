name: Build installable TrazYar APK
on:
  push:
    branches: [trazyar-direct-install]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify slope, angle and square mathematics
        run: |
          mkdir -p /tmp/trazyar-classes
          javac -encoding UTF-8 -d /tmp/trazyar-classes TrazYarInstaller/app/src/main/java/com/trazyar/level/LevelMath.java TrazYarInstaller/verification/LevelMathTest.java
          java -cp /tmp/trazyar-classes com.trazyar.level.LevelMathTest
      - name: Verify proximity beep profiles
        run: |
          mkdir -p /tmp/trazyar-beep-tests
          javac -encoding UTF-8 -d /tmp/trazyar-beep-tests TrazYarInstaller/app/src/main/java/com/trazyar/level/BeepPattern.java TrazYarInstaller/verification/BeepPatternTest.java
          java -cp /tmp/trazyar-beep-tests com.trazyar.level.BeepPatternTest
      - name: Validate offline Persian help pages
        run: |
          mkdir -p /tmp/trazyar-help-tests
          javac -encoding UTF-8 -d /tmp/trazyar-help-tests TrazYarInstaller/app/src/main/java/com/trazyar/level/TutorialContent.java TrazYarInstaller/verification/TutorialContentTest.java
          java -cp /tmp/trazyar-help-tests com.trazyar.level.TutorialContentTest
      - name: Verify two-position calibration math
        run: |
          mkdir -p /tmp/trazyar-cal-test
          javac -encoding UTF-8 -d /tmp/trazyar-cal-test TrazYarInstaller/app/src/main/java/com/trazyar/level/CalibrationMath.java TrazYarInstaller/verification/CalibrationMathTest.java
          java -cp /tmp/trazyar-cal-test com.trazyar.level.CalibrationMathTest
      - name: Test installer four-corner geometry and before-after reports
        run: |
          mkdir -p /tmp/trazyar-installer-test
          javac -encoding UTF-8 -d /tmp/trazyar-installer-test TrazYarInstaller/app/src/main/java/com/trazyar/level/InstallerMath.java TrazYarInstaller/app/src/main/java/com/trazyar/level/InstallerReport.java TrazYarInstaller/verification/InstallerMathTest.java
          java -cp /tmp/trazyar-installer-test com.trazyar.level.InstallerMathTest
      - name: Verify full offline user guide and app introduction
        run: |
          mkdir -p /tmp/trazyar-guide-test
          javac -encoding UTF-8 -d /tmp/trazyar-guide-test TrazYarInstaller/app/src/main/java/com/trazyar/level/GuideContent.java TrazYarInstaller/verification/GuideContentTest.java
          java -cp /tmp/trazyar-guide-test com.trazyar.level.GuideContentTest
      - name: Verify six real-life project walkthroughs
        run: |
          mkdir -p /tmp/trazyar-project-tests
          javac -encoding UTF-8 -d /tmp/trazyar-project-tests TrazYarInstaller/app/src/main/java/com/trazyar/level/GuideContent.java TrazYarInstaller/app/src/main/java/com/trazyar/level/ProjectCoachContent.java TrazYarInstaller/verification/ProjectCoachContentTest.java
          java -cp /tmp/trazyar-project-tests com.trazyar.level.ProjectCoachContentTest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        working-directory: TrazYarInstaller
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish downloadable APK on isolated branch
        run: |
          cp TrazYarInstaller/app/build/outputs/apk/debug/app-debug.apk TrazYar_Samsung_v3_1_ProjectCoach.apk
          test -s TrazYar_Samsung_v3_1_ProjectCoach.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f TrazYar_Samsung_v3_1_ProjectCoach.apk
          git commit -m "Publish installable TrazYar 3.1 task-based guided learning assistant APK [skip ci]"
          git push origin HEAD:trazyar-direct-install
