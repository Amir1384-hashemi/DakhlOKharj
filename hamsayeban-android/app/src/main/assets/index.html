/* Financial rules shared by the UI and automated tests. Amounts are integer rials. */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  root.Finance = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';
  const DEBIT_TYPES = new Set(['charge', 'allocation', 'refund', 'debit_adjustment']);
  const CREDIT_TYPES = new Set(['payment', 'credit_adjustment']);
  function sign(type) { return DEBIT_TYPES.has(type) ? 1 : CREDIT_TYPES.has(type) ? -1 : 0; }
  function signedEntry(entry) { return Number(entry.amount || 0) * sign(entry.type); }
  function balance(entries, unitId, throughDate, beforeDate) {
    return (entries || []).filter(e => e.unitId === unitId &&
      (!throughDate || e.date <= throughDate) && (!beforeDate || e.date < beforeDate))
      .reduce((sum, entry) => sum + signedEntry(entry), 0);
  }
  function account(balanceAmount) {
    return { debt: Math.max(0, balanceAmount), credit: Math.max(0, -balanceAmount), settled: balanceAmount === 0 };
  }
  function shareExpense(amount, units, method) {
    if (!Number.isSafeInteger(amount) || amount < 0) throw new Error('مبلغ هزینه نامعتبر است.');
    if (!units.length) throw new Error('برای تسهیم باید واحد تعریف شود.');
    const weight = u => method === 'persons' ? Math.max(0, Number(u.persons || 0)) :
      method === 'area' ? Math.max(0, Number(u.area || 0)) : method === 'elevator' ? Math.max(1, Number(u.floor || 0) + 1) : 1;
    const weights = units.map(weight);
    const total = weights.reduce((x, y) => x + y, 0);
    if (!total) throw new Error('برای این روش تسهیم، تعداد نفرات یا متراژ باید ثبت شود.');
    // Largest-remainder rounding: the sum of shares always equals the original expense.
    const estimates = units.map((u, i) => amount * weights[i] / total);
    const parts = estimates.map(Math.floor);
    let remaining = amount - parts.reduce((a, b) => a + b, 0);
    const indexes = estimates.map((v, i) => ({ i, rest: v - parts[i] }))
      .sort((a, b) => b.rest - a.rest || a.i - b.i);
    for (let j = 0; j < remaining; j++) parts[indexes[j].i] += 1;
    return units.map((u, i) => ({ unitId: u.id, amount: parts[i] }));
  }
  function cashBalance(cash, throughDate, beforeDate) {
    return (cash || []).filter(e => (!throughDate || e.date <= throughDate) &&
      (!beforeDate || e.date < beforeDate))
      .reduce((sum, e) => sum + (e.type === 'income' ? e.amount : -e.amount), 0);
  }
  function totalPositions(building, throughDate) {
    return building.units.reduce((tot, unit) => {
      const position = account(balance(building.ledger, unit.id, throughDate));
      tot.debt += position.debt; tot.credit += position.credit;
      tot.debtors += position.debt > 0 ? 1 : 0;
      tot.creditors += position.credit > 0 ? 1 : 0;
      return tot;
    }, { debt: 0, credit: 0, debtors: 0, creditors: 0 });
  }
  function monthlyStatement(building, period) {
    const start = period + '-01';
    const end = period + '-31';
    const monthCash = building.cash.filter(x => x.date >= start && x.date <= end);
    const monthLedger = building.ledger.filter(x => x.date >= start && x.date <= end);
    const openingCash = cashBalance(building.cash, undefined, start);
    const incomingPayments = monthCash.filter(x => x.type === 'income' && x.source === 'payment').reduce((n, x) => n + x.amount, 0);
    const otherIncome = monthCash.filter(x => x.type === 'income' && x.source !== 'payment').reduce((n, x) => n + x.amount, 0);
    const spending = monthCash.filter(x => x.type === 'expense').reduce((n, x) => n + x.amount, 0);
    const billed = monthLedger.filter(x => x.type === 'charge' || x.type === 'allocation').reduce((n, x) => n + x.amount, 0);
    return { period, openingCash, incomingPayments, otherIncome, spending, billed,
      closingCash: openingCash + incomingPayments + otherIncome - spending,
      positions: totalPositions(building, end) };
  }
  function isLocked(building, date) {
    const month = date.slice(0, 7);
    const year = date.slice(0, 4);
    return (building.closedMonths || []).includes(month) || (building.closedYears || []).some(x => x.year === year);
  }
  return { sign, signedEntry, balance, account, shareExpense, cashBalance, totalPositions, monthlyStatement, isLocked };
});

function renderUnits(){const res=ui.role==='resident',units=res?[activeUnit()]:b().units;
 if(ui.selectedUnitId){const u=units.find(u=>u.id===ui.selectedUnitId);if(u)return unitDetail(u);ui.selectedUnitId=null;}
 if(res)return unitDetail(activeUnit(),true);
 const filtered=units.filter(u=>(u.number+' '+u.owner+' '+u.occupant).includes(ui.unitSearch));
 return `<section class="card"><div class="toolbar"><div><h3 class="section-title">واحدهای ساختمان <span class="badge info">${num(units.length)} واحد</span></h3><p class="help">برای مشاهده دفتر مالی، روی ردیف واحد بزنید.</p></div><span class="badge good">🔒 تعداد واحدهای ساختمان ثابت است</span></div><div class="toolbar"><input class="search" id="unit-search" placeholder="جستجوی شماره واحد یا نام ساکن..." value="${esc(ui.unitSearch)}" aria-label="جستجوی واحد"><span class="help">برای تغییر مشخصات، روی واحد بزنید.</span></div><div class="table-wrap"><table><thead><tr><th>واحد</th><th>مالک</th><th>ساکن</th><th>وضعیت</th><th>مانده حساب</th><th>جزئیات</th></tr></thead><tbody>${filtered.map(u=>{let x=rowPosition(u);return `<tr class="clickable" data-action="view-unit" data-id="${esc(u.id)}"><td><b>${esc(u.number)}</b></td><td>${esc(u.owner||'—')}</td><td>${esc(u.occupant||'—')}</td><td><span class="badge ${u.occupancy==='vacant'?'warn':'info'}">${occupancyName[u.occupancy]}</span></td><td><span class="amount ${x.debt?'debt':x.credit?'credit':''}">${x.debt?'بدهی '+toman(x.debt):x.credit?'طلب '+toman(x.credit):'تسویه'}</span></td><td><span class="quick-link">مشاهده ←</span></td></tr>`;}).join('')||'<tr><td colspan="6">واحدی یافت نشد.</td></tr>'}</tbody></table></div></section>`;
}
function unitDetail(u,fromResident=false){const ledger=b().ledger.filter(x=>x.unitId===u.id).sort(sortLedger);const x=rowPosition(u);const p=currentMonth(),prior=F.balance(b().ledger,u.id,undefined,p+'-01');
 return `<div class="stack"><div class="flex-between"><h3>دفتر مالی واحد ${esc(u.number)} ${statusBadge(u)}</h3>${!fromResident?`<button class="btn" data-action="back-units">← بازگشت به واحدها</button>`:''}</div><section class="card"><div class="flex-between"><div><div class="muted">مالک: ${esc(u.owner||'ثبت نشده')} • ساکن: ${esc(u.occupant||'واحد خالی')}</div><h3>${esc(occupancyName[u.occupancy])}</h3><div class="help">${num(u.persons)} نفر • ${num(u.area)} متر مربع • تماس: ${esc(u.phone||'ثبت نشده')}</div></div>${ui.role==='manager'?`<button class="btn" data-action="edit-unit" data-id="${esc(u.id)}">✏️ ویرایش اطلاعات</button>`:''}</div></section><div class="grid metrics">${metric('بدهی جاری',toman(x.debt),'📌','debt')}${metric('طلب واحد',toman(x.credit),'✅','credit')}${metric('مانده از ماه قبل',(prior>0?'بدهی ':prior<0?'طلب ':'')+toman(prior),'🔄')}${metric('تراکنش‌ها',num(ledger.length),'📜')}</div><section class="card"><div class="flex-between"><h3 class="section-title">ریز حساب واحد</h3><div class="actions">${ui.role==='manager'?`<button class="btn primary tiny" data-action="goto-finance" data-tab="collections" data-unit="${esc(u.id)}">＋ دریافت بدهی</button><button class="btn tiny" data-action="goto-finance" data-tab="settlement" data-unit="${esc(u.id)}">✓ تسویه حساب</button>`:''}<button class="btn tiny" data-action="export-unit" data-id="${esc(u.id)}">⬇ دریافت CSV</button></div></div><div class="notice">مانده حساب، مجموع شارژها و سهم هزینه‌ها منهای پرداخت‌هاست. بستانکاری در صدور شارژ ماه بعد خودکار تهاتر می‌شود.</div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>تاریخ</th><th>شرح</th><th>بدهکار (+)</th><th>بستانکار (−)</th></tr></thead><tbody>${ledger.map(e=>`<tr><td>${persianDate(e.date)}</td><td>${esc(e.label||kindName[e.type])}${e.receipt?`<div><a class="quick-link" href="${e.receipt}" target="_blank" rel="noopener">📎 تصویر فیش</a></div>`:''}</td><td class="debt">${F.sign(e.type)>0?toman(e.amount):'—'}</td><td class="credit">${F.sign(e.type)<0?toman(e.amount):'—'}</td></tr>`).join('')||'<tr><td colspan="4">هنوز تراکنشی ثبت نشده است.</td></tr>'}</tbody></table></div></section></div>`;
}
function renderFinance(){if(ui.role==='resident')return renderResidentFinance();
 const tabs=[['charges','صدور شارژ'],['payments','ثبت پرداخت'],['reminders','یادآوری بدهکاران'],['expenses','هزینه‌ها'],['income','درآمد و استرداد'],['collections','دریافت بدهی'],['settlement','تسویه واحد']];
 return `<div class="tabs">${tabs.map(t=>`<button class="${ui.financeTab===t[0]?'active':''}" data-action="finance-tab" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>${({charges:chargePanel,payments:paymentPanel,reminders:remindersPanel,expenses:expensePanel,income:incomePanel,collections:collectionPanel,settlement:settlementPanel})[ui.financeTab]()}`;

function chargePanel(){const p=currentMonth(),issue=b().issuedPeriods[p],base=b().settings?.defaultCharge||1200000;

function remindersPanel(){const debtors=b().units.map(u=>({u,...rowPosition(u)})).filter(x=>x.debt>0);return `<section class="card"><div class="flex-between"><div><h3 class="section-title">🔔 یادآوری بدهکاران <span class="badge danger">${num(debtors.length)} واحد</span></h3><p class="help">با ثبت پرداخت، بدهی خودکار کم می‌شود و از فهرست بدهکاران تسویه‌شده خارج می‌شوند.</p></div><button class="btn primary" data-action="remind-all" ${!debtors.length?'disabled':''}>📨 ثبت یادآوری گروهی</button></div><div class="notice warn">این نسخه نمایشی پیام‌ها را داخل برنامه ذخیره می‌کند؛ پیامک واقعی ارسال نمی‌کند.</div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>واحد</th><th>نام</th><th>بدهی</th><th>وضعیت</th><th>یادآوری</th></tr></thead><tbody>${debtors.map(x=>`<tr><td>${esc(x.u.number)}</td><td>${esc(x.u.occupant||x.u.owner)}</td><td class="debt amount">${toman(x.debt)}</td><td><span class="badge danger">پرداخت‌نشده / ناقص</span></td><td><button class="btn tiny" data-action="remind-unit" data-id="${esc(x.u.id)}">🔔 یادآوری</button></td></tr>`).join('')||'<tr><td colspan="5">✅ هیچ واحد بدهکاری وجود ندارد.</td></tr>'}</tbody></table></div></section>`;}
function expensePanel(){return `<div class="grid two-col"><section class="card"><h3 class="section-title">۳. ثبت هزینه و تقسیم بین واحدها</h3><p class="help">هر قبض در صندوق به‌عنوان پرداخت ثبت می‌شود. در صورت انتخاب «تسهیم»، سهم هر واحد به دفتر مالی همان واحد افزوده می‌شود.</p><form id="expense-form" class="form-grid">${field('عنوان هزینه','title','text','','required placeholder="مثلاً آب مشترک"')}${field('مبلغ کل هزینه (ریال)','amount','number','','required min="1"')}${field('تاریخ پرداخت هزینه','date','date',today(),'required')}${selector('روش تقسیم هزینه','method','<option value="persons">بر اساس تعداد نفرات</option><option value="area">بر اساس متراژ</option><option value="equal">مساوی بین همه واحدها</option><option value="elevator">آسانسور: سهم بیشتر برای طبقات بالاتر</option>')}<label class="full help"><input type="checkbox" name="allocate" checked> سهم هزینه به حساب هر واحد منظور شود</label><div class="field full"><label>تصویر قبض یا فاکتور (اختیاری)</label><input type="file" name="receipt" accept="image/*"></div><button class="btn primary full">🧾 ثبت هزینه و تسهیم</button></form></section><section class="card"><h3 class="section-title">آخرین هزینه‌های ساختمان</h3><div class="timeline">${b().expenses.slice().sort(sortLedger).slice(0,7).map(x=>`<div class="item"><div><b>${esc(x.title)}</b><div class="help">${persianDate(x.date)} • ${x.allocated?'تسهیم‌شده':'بدون تسهیم'}</div>${x.receipt?`<a class="quick-link" href="${x.receipt}" target="_blank" rel="noopener">👁️ مشاهده تصویر قبض</a>`:''}</div><span class="amount debt">${toman(x.amount)}</span></div>`).join('')||'<div class="empty">هنوز هزینه‌ای ثبت نشده است.</div>'}</div><div class="notice" style="margin-top:12px">💡 هزینه‌ای که قبلاً از محل شارژ ثابت پوشش داده شده، نباید دوباره به حساب واحدها منظور شود.</div></section></div>`;}
function incomePanel(){const creditUnits=b().units.filter(u=>rowPosition(u).credit>0);return `<div class="grid two-col"><section class="card"><h3 class="section-title">ثبت سایر درآمدهای ساختمان</h3><form id="income-form" class="form-grid">${field('عنوان درآمد','title','text','','required placeholder="مثلاً اجاره سالن اجتماعات"')}${field('مبلغ دریافتی (ریال)','amount','number','','required min="1"')}${field('تاریخ دریافت','date','date',today(),'required')}<button class="btn green full">＋ ثبت درآمد در صندوق</button></form></section><section class="card"><h3 class="section-title">استرداد وجه به واحد بستانکار</h3><p class="help">اگر واحد اضافه پرداخت کرده باشد، می‌توانید تمام یا بخشی از طلب او را نقداً برگردانید. استرداد، طلب واحد و موجودی صندوق را به همان میزان کاهش می‌دهد.</p><form id="refund-form" class="form-grid">${selector('واحد بستانکار','unitId',creditUnits.length?creditUnits.map(u=>`<option value="${esc(u.id)}">${esc(unitLabel(u))} — طلب ${toman(rowPosition(u).credit)}</option>`).join(''):'<option value="">هیچ بستانکاری وجود ندارد</option>')}${field('مبلغ استرداد (ریال)','amount','number','','required min="1"')}${field('تاریخ استرداد','date','date',today(),'required')}<button class="btn primary full" ${!creditUnits.length?'disabled':''}>↩ ثبت استرداد</button></form></section></div>`;}
function renderResidentFinance(){const u=activeUnit(),x=rowPosition(u),ledger=b().ledger.filter(t=>t.unitId===u.id).sort(sortLedger),issued=b().issuedPeriods[currentMonth()];return `<div class="stack"><section class="card"><h3>حساب شما — واحد ${esc(u.number)}</h3><div class="grid metrics">${metric('بدهی فعلی',toman(x.debt),'📌','debt')}${metric('طلب شما',toman(x.credit),'✅','credit')}${metric('مهلت پرداخت',issued?persianDate(issued.dueDate):'تعیین نشده','📅')}${metric('وضعیت',x.debt?'بدهکار':x.credit?'بستانکار':'تسویه','🏠')}</div><div class="notice">برای پرداخت، مبلغ را به حساب اعلام‌شده توسط مدیر واریز کنید و تصویر فیش را برای مدیر بفرستید. اتصال درگاه بانکی هنوز در این نمونه فعال نیست.</div></section><section class="card"><h3 class="section-title">ریز پرداخت‌ها و شارژهای من</h3><div class="timeline">${ledger.map(e=>`<div class="item"><div><b>${esc(e.label||kindName[e.type])}</b><div class="help">${persianDate(e.date)}</div></div><b class="amount ${F.sign(e.type)>0?'debt':'credit'}">${F.sign(e.type)>0?'+':'−'} ${toman(e.amount)}</b></div>`).join('')}</div></section></div>`;}
function renderSocial(){const building=b(),res=ui.role==='resident',u=activeUnit();return `<div class="grid two-col"><section class="card"><div class="flex-between"><h3 class="section-title">📣 تابلو اعلانات</h3>${!res?'<button class="btn tiny primary" data-action="new-notice">＋ اطلاعیه جدید</button>':''}</div><div class="timeline">${building.notices.slice().reverse().map(n=>`<div class="item"><div><b>${esc(n.title)}</b><div class="help">${esc(n.body)}<div>${persianDate(n.date)}</div></div></div><span>📢</span></div>`).join('')||'<div class="empty">اطلاعیه‌ای ثبت نشده است.</div>'}</div><h3 class="section-title" style="margin-top:20px">🗳️ رأی‌گیری ساکنین</h3>${!res?'<button class="btn tiny" data-action="new-poll">＋ ایجاد رأی‌گیری</button>':''}<div class="timeline" style="margin-top:10px">${building.polls.map(p=>{const votes=Object.values(p.votes||{}),yes=votes.filter(x=>x==='yes').length,no=votes.length-yes,cast=!!p.votes?.[u.id];return `<div class="item"><div><b>${esc(p.title)}</b><div class="help">موافق: ${num(yes)} | مخالف: ${num(no)} | شرکت‌کنندگان: ${num(votes.length)}</div>${res&&!cast?`<div class="actions" style="margin-top:8px"><button class="btn tiny green" data-action="vote" data-id="${esc(p.id)}" data-vote="yes">موافقم</button><button class="btn tiny" data-action="vote" data-id="${esc(p.id)}" data-vote="no">مخالفم</button></div>`:res?'<span class="badge good">رأی شما ثبت شده</span>':''}</div><span>🗳️</span></div>`}).join('')||'<div class="empty">رأی‌گیری فعالی نیست.</div>'}</div></section><section class="card"><div class="flex-between"><h3 class="section-title">🛠️ مشکلات و درخواست‌ها</h3><div class="actions"><button class="btn tiny" data-action="new-suggestion">💡 ثبت پیشنهاد</button><button class="btn primary tiny" data-action="new-ticket">＋ ثبت مشکل</button></div></div><div class="timeline">${building.tickets.filter(t=>!res||t.unitId===u.id).slice().reverse().map(t=>{const tu=building.units.find(x=>x.id===t.unitId);return `<div class="item"><div><b>${t.kind==='suggestion'?'💡 پیشنهاد: ':'🛠️ '}${esc(t.title)}</b><div class="help">${esc(t.body)} • ${tu?'واحد '+esc(tu.number):'مدیریت'} • ${persianDate(t.date)}</div><button class="btn tiny" data-action="ticket-detail" data-id="${esc(t.id)}">💬 توضیحات و پیگیری</button><span class="badge ${t.status==='حل شد'||t.status==='انجام شد'?'good':t.status==='در حال پیگیری'||t.status==='در حال بررسی'?'warn':'info'}">${esc(t.status)}</span></div>${!res?`<select class="select-building ticket-status" data-id="${esc(t.id)}" aria-label="وضعیت درخواست"><option ${t.status==='ثبت شده'?'selected':''}>ثبت شده</option><option ${t.status==='در حال پیگیری'?'selected':''}>در حال پیگیری</option><option ${t.status==='ارجاع به پیمانکار'?'selected':''}>ارجاع به پیمانکار</option><option ${t.status==='حل شد'?'selected':''}>حل شد</option></select>`:''}</div>`;}).join('')||'<div class="empty">هنوز درخواستی وجود ندارد.</div>'}</div><div class="notice" style="margin-top:15px">💬 درخواست‌ها از زمان ثبت تا انجام شدن قابل پیگیری هستند. در این نسخه گفت‌وگوی خصوصی لحظه‌ای هنوز فعال نیست.</div></section></div>`;}
function renderReports(){const building=b(),res=ui.role==='resident',period=ui.reportPeriod,statement=F.monthlyStatement(building,period),annual=period.slice(0,4),yearCash=building.cash.filter(x=>x.date.startsWith(annual)),inc=yearCash.filter(x=>x.type==='income').reduce((n,x)=>n+x.amount,0),out=yearCash.filter(x=>x.type==='expense').reduce((n,x)=>n+x.amount,0);
 if(res){return `<div class="stack"><section class="card"><h3>گزارش حساب واحد ${esc(activeUnit().number)}</h3><p class="help">این گزارش فقط مربوط به واحد شماست.</p><button class="btn primary" data-action="export-unit" data-id="${esc(activeUnit().id)}">⬇ دریافت ریز حساب (CSV)</button></section>${unitDetail(activeUnit(),true)}</div>`;}
 return `<div class="stack"><section class="card"><div class="toolbar"><h3 class="section-title">بیلان ماهانه ساختمان</h3><div class="actions"><select id="report-period" class="search" aria-label="انتخاب ماه گزارش" style="max-width:190px">${periodOptions(period)}</select><button class="btn tiny" data-action="export-report">⬇ گزارش CSV</button></div></div><div class="notice">درآمدهای صندوق با شارژهای صادرشده متفاوت‌اند؛ قبض شارژ تا زمانی که واقعاً پرداخت نشود، پول موجود در صندوق محسوب نمی‌شود.</div><div class="grid metrics">${metric('موجودی اول ماه',toman(statement.openingCash),'🏦')}${metric('پرداخت شارژ دریافتی',toman(statement.incomingPayments),'💳')}${metric('سایر درآمدها',toman(statement.otherIncome),'💰')}${metric('مخارج پرداخت‌شده',toman(statement.spending),'🧾','debt')}</div><div class="unit-card"><div><div class="muted">مانده صندوق آخر ماه</div><div class="stat credit">${toman(statement.closingCash)}</div></div><div><div class="muted">شارژ و هزینه تخصیص‌یافته</div><div class="stat">${toman(statement.billed)}</div></div><div><div class="muted">مجموع بدهی ساکنین</div><div class="stat debt">${toman(statement.positions.debt)}</div></div><div><div class="muted">مجموع طلب ساکنین</div><div class="stat credit">${toman(statement.positions.credit)}</div></div></div></section><div class="grid two-col"><section class="card"><h3 class="section-title">حساب واحدها در پایان ماه</h3><div class="table-wrap"><table><thead><tr><th>واحد</th><th>وضعیت</th><th>بدهی</th><th>طلب</th></tr></thead><tbody>${building.units.map(u=>{const x=rowPosition(u,period);return `<tr><td>${esc(u.number)}</td><td>${statusBadge(u,period)}</td><td class="debt">${toman(x.debt)}</td><td class="credit">${toman(x.credit)}</td></tr>`;}).join('')}</tbody></table></div></section><section class="card"><h3 class="section-title">بستن دوره و انتقال مانده</h3><div class="notice">📆 مانده هر واحد و صندوق به صورت خودکار در محاسبات ماه بعد لحاظ می‌شود. بستن دوره صرفاً آن را قفل می‌کند؛ هیچ مبلغ تکراری به دفتر حساب افزوده نمی‌شود.</div><div class="actions" style="margin:15px 0"><button class="btn secondary" data-action="close-month" ${building.closedMonths.includes(period)?'disabled':''}>🔒 ${building.closedMonths.includes(period)?'ماه بسته شده':'بستن ماه '+readablePeriod(period)}</button></div><div class="subheading">خلاصه سال ${esc(annual)}</div><div class="step"><b>↑</b><div>درآمدهای وصول‌شده: <strong>${toman(inc)}</strong></div></div><div class="step"><b>↓</b><div>مخارج پرداخت‌شده: <strong>${toman(out)}</strong></div></div><div class="step"><b>↔</b><div>مانده خالص جریان نقد سال: <strong>${toman(inc-out)}</strong></div></div><button class="btn primary" data-action="close-year" ${building.closedYears.some(x=>x.year===annual)?'disabled':''}>📘 ${building.closedYears.some(x=>x.year===annual)?'سال بسته شده':'بستن حساب سال '+esc(annual)}</button><div class="subheading">پشتیبان‌گیری از اطلاعات</div><button class="btn" data-action="backup">⬇ دریافت نسخه پشتیبان JSON</button><p class="help">داده‌ها فعلاً فقط در همین مرورگر ذخیره می‌شوند؛ برای استفاده واقعی لازم است سرور و پشتیبان‌گیری امن پیاده‌سازی شود.</p></section></div></div>`;
}

function showTicketForm(kind='ticket'){showModal(kind==='suggestion'?'ثبت پیشنهاد':'ثبت مشکل یا درخواست',`<form id="ticket-form" class="form-grid"><input type="hidden" name="kind" value="${esc(kind)}">${ui.role==='manager'?selector('واحد ثبت‌کننده','unitId',unitOpts()):''}${field('عنوان مشکل','title','text','','required placeholder="مثلاً خرابی آسانسور"')}<div class="field full"><label>توضیحات</label><textarea name="body" required placeholder="مشکل را کوتاه و روشن توضیح دهید."></textarea></div><button class="btn primary full">📨 ثبت و ارسال به مدیر</button></form>`);}
function showNoticeForm(){showModal('اطلاعیه جدید',`<form id="notice-form" class="form-grid">${field('عنوان اطلاعیه','title','text','','required')}<div class="field full"><label>متن اطلاعیه</label><textarea name="body" required></textarea></div><button class="btn primary full">📢 انتشار در تابلو اعلانات</button></form>`);}
function showPollForm(){showModal('رأی‌گیری جدید',`<form id="poll-form" class="form-grid">${field('سؤال رأی‌گیری (بله / خیر)','title','text','','required')}<button class="btn primary full">🗳️ انتشار رأی‌گیری</button></form>`);}
function readReceipt(form){return new Promise((resolve,reject)=>{const file=form.querySelector('input[name="receipt"]')?.files?.[0];if(!file)return resolve(null);if(file.size>1024*1024)return reject(Error('حداکثر حجم هر تصویر ۱ مگابایت است.'));if(!file.type.startsWith('image/'))return reject(Error('فقط تصویر قابل بارگذاری است.'));const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=()=>reject(Error('خواندن تصویر با خطا مواجه شد.'));reader.readAsDataURL(file);});}
function input(form,name){const raw=new FormData(form).get(name);if(typeof raw!=='string')return raw;let x=localeDigits(raw.trim());if(['date','issueDate','dueDate'].includes(name)){x=jalali(x).replaceAll('/','-');if(!/^\d{4}-\d{2}-\d{2}$/.test(x)){throw Error('تاریخ شمسی را به صورت سال/ماه/روز وارد کنید.');}fromJalali(x);return x;}if(name==='period'){x=x.replaceAll('/','-');if(!/^\d{4}-\d{2}$/.test(x)||Number(x.slice(5))<1||Number(x.slice(5))>12)throw Error('ماه شمسی معتبر وارد کنید.');return x;}return x;}
function receivePayment(unitId,amount,date,method,receipt){const u=b().units.find(x=>x.id===unitId);if(!u)throw Error('واحد مشخص نشده است.');guardOpen(date);const id=uid();b().ledger.push({id,unitId,type:'payment',amount,date,period:periodOf(date),label:'پرداخت '+(method||'ساکن'),method,receipt});b().cash.push({id:uid(),referenceId:id,date,type:'income',source:'payment',unitId,amount,title:'دریافت از واحد '+u.number});return F.account(F.balance(b().ledger,unitId));}
function issueCharges(period,amount,issueDate,dueDate){if(!/^\d{4}-\d{2}$/.test(period))throw Error('ماه نامعتبر است.');if(periodOf(issueDate)!==period)throw Error('تاریخ صدور باید در ماه انتخابی باشد.');if(dueDate<issueDate)throw Error('مهلت پرداخت نمی‌تواند قبل از تاریخ صدور باشد.');guardOpen(issueDate);if(b().issuedPeriods[period])throw Error('شارژ این ماه قبلاً صادر شده است.');b().units.forEach(u=>b().ledger.push({id:uid(),unitId:u.id,type:'charge',date:issueDate,period,amount,label:'شارژ '+readablePeriod(period),dueDate}));b().issuedPeriods[period]={issueDate,dueDate,amount};b().settings.defaultCharge=amount;}
function addExpense(title,amount,date,method,allocate,receipt){guardOpen(date);let shares=[];if(allocate)shares=F.shareExpense(amount,b().units,method);const id=uid();b().expenses.push({id,title,amount,date,method,allocated:allocate,receipt});b().cash.push({id:uid(),source:'expense',expenseId:id,title,date,type:'expense',amount});shares.filter(s=>s.amount>0).forEach(s=>b().ledger.push({id:uid(),unitId:s.unitId,type:'allocation',date,period:periodOf(date),amount:s.amount,label:'سهم '+title,expenseId:id}));}
function download(content,filename,mime='text/plain;charset=utf-8'){if(window.HamsayebanBridge?.saveText){window.HamsayebanBridge.saveText(filename,String(content),mime);return;}const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function csv(rows){const wrap=v=>'"'+String(v??'').replaceAll('"','""')+'"';return '\ufeff'+rows.map(row=>row.map(wrap).join(',')).join('\r\n');}
function exportUnit(id){const u=b().units.find(x=>x.id===id);if(!u)throw Error('واحد یافت نشد.');download(csv([['تاریخ','واحد','شرح','نوع','مبلغ ریال'],...b().ledger.filter(x=>x.unitId===id).sort(sortLedger).map(e=>[e.date,u.number,e.label,kindName[e.type],F.signedEntry(e)])]),`حساب-واحد-${u.number}.csv`,'text/csv;charset=utf-8');}
function exportReport(){const p=ui.reportPeriod,s=F.monthlyStatement(b(),p);download(csv([['بیلان ماه',p],['موجودی اول ماه',s.openingCash],['دریافت شارژ',s.incomingPayments],['سایر درآمد',s.otherIncome],['مخارج',s.spending],['مانده صندوق',s.closingCash],['مجموع بدهی واحدها',s.positions.debt],['مجموع طلب واحدها',s.positions.credit],[],['شماره واحد','بدهی','طلب'],...b().units.map(u=>{const x=rowPosition(u,p);return [u.number,x.debt,x.credit];})]),`بیلان-${p}.csv`,'text/csv;charset=utf-8');}
function addReminder(unitId){const u=b().units.find(x=>x.id===unitId);if(!u)return false;const debt=rowPosition(u).debt;if(!debt)return false;b().reminders.push({id:uid(),unitId,date:today(),amount:debt});return true;}
function confirmCloseMonth(){const p=ui.reportPeriod;if(b().closedMonths.includes(p))return;const closedFuture=b().closedYears.some(x=>x.year===p.slice(0,4));if(closedFuture)throw Error('سال مربوطه قبلاً بسته شده است.');if(!confirm('پس از بستن این ماه، ثبت تراکنش جدید با تاریخ همان ماه ممکن نیست. ادامه می‌دهید؟'))return;b().closedMonths.push(p);save();render();toast('ماه بسته شد؛ مانده‌ها خودکار به دوره بعد منتقل می‌شوند.');}
function confirmCloseYear(){const y=ui.reportPeriod.slice(0,4);if(!confirm('حساب‌های سال '+y+' قفل می‌شوند و مانده‌ها به سال بعد انتقال می‌یابند. ادامه می‌دهید؟'))return;const snapshot={year:y,closedAt:today(),cashBalance:F.cashBalance(b().cash,y+'-12-31'),positions:F.totalPositions(b(),y+'-12-31')};b().closedYears.push(snapshot);save();render();toast('سال مالی بسته شد. مانده‌ها بدون ثبت تکراری حفظ شدند.');}

document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
 try{
 switch(a){
 case 'nav':ui.page=el.dataset.page;ui.selectedUnitId=null;break;
 case 'nav-social':ui.page='social';break;
 case 'goto-finance':ui.page='finance';ui.financeTab=el.dataset.tab||'charges';ui.collectUnitId=el.dataset.unit||null;ui.selectedUnitId=null;break;
 case 'finance-tab':ui.financeTab=el.dataset.tab;break;
 case 'toggle-role':ui.role=ui.role==='manager'?'resident':'manager';ui.residentUnitId||=b().units[0]?.id;ui.page='home';ui.selectedUnitId=null;break;
 case 'view-unit':ui.selectedUnitId=el.dataset.id;break;
 case 'back-units':ui.selectedUnitId=null;break;
 case 'new-building':showBuildingForm();return;
 case 'new-unit':throw Error('تعداد واحدها هنگام ساخت ساختمان تعیین شده و قابل افزایش نیست.');
 case 'edit-unit':showUnitForm(b().units.find(x=>x.id===el.dataset.id));return;
 case 'close-modal':ui.modal=null;break;
 case 'new-ticket':showTicketForm();return;
 case 'new-suggestion':showTicketForm('suggestion');return;
 case 'ticket-detail':showTicketDetail(el.dataset.id);return;
 case 'new-notice':if(ui.role!=='manager')return;showNoticeForm();return;
 case 'new-poll':if(ui.role!=='manager')return;showPollForm();return;
 case 'change-unit-count':throw Error('افزودن واحد بعد از ثبت ساختمان مجاز نیست.');/* showModal('افزودن چند واحد',`<form id="units-bulk-form" class="form-grid">${field('تعداد واحد جدید','count','number',5,'min="1" max="200" required')}<div class="notice full">حداکثر ۲۰۰ واحد در هر ساختمان. شماره واحدهای جدید به صورت ترتیبی تعیین می‌شوند.</div><button class="btn primary full">＋ افزودن</button></form>`);return;*/
 case 'remind-unit':toast(addReminder(el.dataset.id)?'یادآوری در برنامه ثبت شد؛ پیامک واقعی ارسال نشده است.':'این واحد بدهی ندارد.');save();break;
 case 'remind-all':{let count=0;b().units.forEach(u=>{if(addReminder(u.id))count++;});save();toast(num(count)+' یادآوری در برنامه ثبت شد (بدون ارسال پیامک).');break;}
 case 'vote':{if(ui.role!=='resident')throw Error('رأی‌گیری برای ساکنین است.');const poll=b().polls.find(p=>p.id===el.dataset.id);if(!poll)throw Error('رأی‌گیری یافت نشد.');if(poll.votes[activeUnit().id])throw Error('این واحد قبلاً رأی داده است.');poll.votes[activeUnit().id]=el.dataset.vote;save();toast('رأی واحد ثبت شد.');break;}
 case 'export-unit':exportUnit(el.dataset.id);return;
 case 'export-report':exportReport();return;
 case 'backup':download(JSON.stringify(state,null,2),'hamsayeban-backup.json','application/json;charset=utf-8');return;
 case 'close-month':confirmCloseMonth();return;
 case 'close-year':confirmCloseYear();return;
 default:return;
 }render();
 }catch(err){toast(err.message||'خطایی رخ داد.');}
});

document.addEventListener('submit',async e=>{const form=e.target;if(!form.id)return;e.preventDefault();const v=n=>input(form,n);
 try{
 if(ui.role==='resident'&&!['ticket-form'].includes(form.id))throw Error('ثبت اطلاعات مالی فقط توسط مدیر مجاز است.');
 switch(form.id){
 case 'building-form':{const count=Number(v('count'));if(!Number.isInteger(count)||count<1||count>200)throw Error('تعداد واحد باید بین ۱ تا ۲۰۰ باشد.');const name=String(v('name')).trim();if(!name)throw Error('نام ساختمان را وارد کنید.');const id=uid(),units=Array.from({length:count},(_,i)=>({id:uid(),number:String(i+1),owner:'',occupant:'',phone:'',persons:0,area:80,floor:Math.floor(i/2)+1,occupancy:'vacant'}));state.buildings.push({id,name,capacity:count,settlements:[],units,ledger:[],cash:[],expenses:[],notices:[],tickets:[],polls:[],reminders:[],issuedPeriods:{},closedMonths:[],closedYears:[],settings:{issueDay:1,dueDay:20,defaultCharge:0}});state.activeBuildingId=id;ui.residentUnitId=units[0].id;break;}
 case 'units-bulk-form':throw Error('ظرفیت واحدها ثابت است.');/*{const count=Number(v('count'));if(!Number.isInteger(count)||count<1||b().units.length+count>200)throw Error('تعداد کل واحدها باید حداکثر ۲۰۰ باشد.');const existing=new Set(b().units.map(u=>u.number));let n=1,added=0;while(added<count){if(!existing.has(String(n))){b().units.push({id:uid(),number:String(n),owner:'',occupant:'',phone:'',persons:0,area:80,occupancy:'vacant'});added++;}n++;}break;}*/
 case 'unit-form':{let u=b().units.find(x=>x.id===v('id'));const number=String(v('number')).trim();if(!number)throw Error('شماره واحد ضروری است.');if(b().units.some(x=>x.number===number&&x.id!==u?.id))throw Error('این شماره واحد قبلاً ثبت شده است.');if(!u)throw Error('ساختمان دارای تعداد واحد ثابت است؛ فقط ویرایش واحدهای موجود مجاز است.');const occupancy=String(v('occupancy'));Object.assign(u,{number,owner:String(v('owner')).trim(),occupant:occupancy==='vacant'?'':String(v('occupant')).trim(),phone:String(v('phone')).trim(),persons:occupancy==='vacant'?0:Number(v('persons')),area:Number(v('area')),floor:Number(v('floor')),occupancy});if(!Number.isFinite(u.persons)||u.persons<0||!Number.isFinite(u.area)||u.area<=0||!Number.isInteger(u.floor)||u.floor<0)throw Error('اطلاعات نفرات یا متراژ معتبر نیست.');break;}
 case 'charge-form':issueCharges(String(v('period')),toSafeAmount(v('amount')),String(v('issueDate')),String(v('dueDate')));break;
 case 'payment-form':{const receipt=await readReceipt(form);const account=receivePayment(String(v('unitId')),toSafeAmount(v('amount')),String(v('date')),String(v('method')),receipt);toast(account.debt?'پرداخت ثبت شد؛ مانده بدهی: '+toman(account.debt):account.credit?'پرداخت ثبت شد؛ طلب واحد: '+toman(account.credit):'پرداخت ثبت شد؛ حساب واحد تسویه است.');break;}
 case 'expense-form':{const receipt=await readReceipt(form);addExpense(String(v('title')).trim(),toSafeAmount(v('amount')),String(v('date')),String(v('method')),v('allocate')==='on',receipt);break;}
 case 'income-form':{const date=String(v('date'));guardOpen(date);b().cash.push({id:uid(),type:'income',source:'other',title:String(v('title')).trim(),amount:toSafeAmount(v('amount')),date});break;}
 case 'refund-form':{const date=String(v('date')),unitId=String(v('unitId')),amount=toSafeAmount(v('amount'));guardOpen(date);if(!b().units.some(u=>u.id===unitId))throw Error('واحد یافت نشد.');if(rowPosition(b().units.find(u=>u.id===unitId)).credit<amount)throw Error('مبلغ استرداد بیشتر از طلب واحد است.');b().ledger.push({id:uid(),type:'refund',unitId,date,amount,label:'استرداد نقدی بستانکاری'});b().cash.push({id:uid(),type:'expense',source:'refund',unitId,amount,date,title:'بازپرداخت طلب واحد'});break;}
 case 'ticket-form':b().tickets.push({id:uid(),kind:String(v('kind')||'ticket'),unitId:ui.role==='resident'?activeUnit().id:String(v('unitId')),title:String(v('title')).trim(),body:String(v('body')).trim(),status:'ثبت شده',date:today(),notes:[]});break;
 case 'notice-form':b().notices.push({id:uid(),title:String(v('title')).trim(),body:String(v('body')).trim(),date:today()});break;
 case 'poll-form':b().polls.push({id:uid(),title:String(v('title')).trim(),votes:{},date:today()});break;
 default:return;
 }
 ui.modal=null;ui.selectedUnitId=null;save();render();if(form.id!=='payment-form')toast('اطلاعات با موفقیت ثبت شد.');
 }catch(err){toast(err.message||'ثبت اطلاعات ناموفق بود.');}
});

 ['گزارش مالی و بستن ماه یا سال','در گزارش‌ها ابتدا ماه شمسی را انتخاب کنید. موجودی صندوق ابتدا، جمع دریافتی شارژ، درآمدهای دیگر، مخارج، مانده پایان ماه و بدهی و طلب همه واحدها مشخص می‌شود. تفاوت مهم: قبض صادرشده پول نقد نیست؛ فقط وجه وصول‌شده موجودی صندوق را تغییر می‌دهد. بعد از تطبیق اسناد، ماه یا سال را ببندید تا سند جدید در دوره قفل‌شده ثبت نشود.'],
 ['تسویه حساب نهایی واحد','در مالی ← تسویه واحد، واحد را انتخاب کنید. تا وقتی بدهی یا بستانکاری باقی باشد، تسویه نهایی مجاز نیست. ابتدا بدهی را دریافت یا طلب را بازپرداخت کنید؛ سپس دکمه ثبت تسویه را بزنید تا صورت‌جلسه دارای تاریخ و توضیح در سوابق همان واحد ذخیره شود. برای خروج ساکن نسخه پشتیبان و ریز حساب واحد را ذخیره کنید.'],
 ['خرابی‌ها، پیگیری و اطلاعیه','ساکن از ارتباطات ← ثبت مشکل، عنوان و شرح را وارد می‌کند. مدیر در همان درخواست «توضیحات و پیگیری» را باز می‌کند و شرح اقدامات، وضعیت در حال پیگیری، ارجاع به پیمانکار یا حل شد را ثبت می‌کند. همه توضیحات در تاریخچه درخواست می‌مانند. اطلاعیه‌های عمومی و رأی‌گیری نیز در ارتباطات ثبت می‌شوند. این نسخه آفلاین است؛ تغییرات مدیر در گوشی دیگری خودکار ظاهر نمی‌شود.'],
 ['نسخه پشتیبان و حفظ اطلاعات','داده‌ها در حافظه محلی همین برنامه نگهداری می‌شوند. برای جلوگیری از از دست رفتن اطلاعات، بعد از ثبت‌های مهم از گزارش‌ها، خروجی JSON بگیرید و در جای مطمئن ذخیره کنید. هنگام تغییر گوشی، حذف برنامه یا پاک‌کردن داده‌ها، اطلاعات محلی ممکن است از بین بروند. PIN محلی جایگزین حساب کاربری امن سروری و احراز هویت بین گوشی‌ها نیست.']
];
const LANG={fa:'فارسی',en:'English',ar:'العربية',tr:'Türkçe'};
const THEME={blue:'آبی',green:'سبز',orange:'نارنجی',purple:'بنفش'};
function settingsRow(title,text,btn=''){return `<div class="v2-row"><div><b>${title}</b><p class="help">${text}</p></div>${btn}</div>`;}
function renderSettings(){return `<div class="stack v2-settings">
 <section class="card"><h3 class="section-title">🔐 رمز ورود و امنیت</h3><p class="help">رمز برای بازکردن داده‌های این دستگاه است؛ این نسخه هنوز حساب کاربری امن و همگام‌سازی بین گوشی‌ها ندارد.</p>
 <form id="pin-form" class="form-grid">${field(prefs.pinHash?'تغییر رمز چهار تا هشت رقمی':'تنظیم رمز چهار تا هشت رقمی','pin','password','','required minlength="4" maxlength="8" pattern="[0-9۰-۹]{4,8}"')}${field('تکرار رمز','confirmPin','password','','required minlength="4" maxlength="8"')}<button class="btn primary" type="submit">${prefs.pinHash?'تغییر رمز':'فعال‌کردن رمز ورود'}</button>${prefs.pinHash?'<button type="button" class="btn" data-action="disable-pin">حذف رمز</button>':''}</form>
 ${settingsRow('اثر انگشت','ورود بیومتریک فقط در نسخه اندرویدی که به سامانه تأیید هویت گوشی متصل شده باشد فعال می‌شود.','<button class="btn" data-action="biometric-help">بررسی پشتیبانی گوشی</button>')}
 </section><section class="card"><h3 class="section-title">🎨 رنگ برنامه</h3><div class="v2-theme-grid">${Object.entries(THEME).map(([key,name])=>`<button class="v2-theme-option ${prefs.theme===key?'chosen':''}" style="--swatch:var(--v2-${key})" data-action="theme-select" data-value="${key}"><span class="v2-color"></span>${name}${prefs.theme===key?' ✓':''}</button>`).join('')}</div></section>
 <section class="card"><h3 class="section-title">🌐 زبان برنامه</h3><div class="v2-theme-grid">${Object.entries(LANG).map(([key,name])=>`<button class="btn ${prefs.language===key?'primary':''}" data-action="language-select" data-value="${key}">${name}</button>`).join('')}</div><p class="help">ترجمهٔ منوهای اصلی فعال است؛ ترجمهٔ کامل فرم‌ها و راهنماها برای زبان‌های دیگر در این نسخه تکمیل نشده است.</p></section>
 <section class="card"><h3 class="section-title">📅 نمایش استاندارد</h3><div class="v2-pillset"><span class="badge good">تقویم شمسی</span><span class="badge good">اعداد فارسی</span><span class="badge good">واحد پول: ریال</span></div></section>
 <section class="card"><h3 class="section-title">📘 آموزش گام‌به‌گام</h3><p class="help">راهنمای مفصل استفاده از تمام ماژول‌ها، همراه با مثال عملی و نحوه محاسبات.</p><button class="btn green" data-action="open-guide">بازکردن آموزش کامل همسایه‌بان</button></section>
 <section class="card"><h3 class="section-title">💾 داده‌ها و پشتیبان‌گیری</h3>${settingsRow('دریافت نسخه پشتیبان','قبل از حذف برنامه یا تغییر گوشی از داده‌های ساختمان خروجی بگیرید.','<button class="btn" data-action="backup">ذخیره JSON</button>')}${settingsRow('حفاظت از اطلاعات','این نسخه آفلاین است و دسترسی ساکن/مدیر تنها پیش‌نمایش روی همان گوشی محسوب می‌شود.','')}<button class="btn" data-action="nav" data-page="reports">📊 دیدن بیلان و گزارش‌ها</button></section></div>`;}
function showGuide(){showModal('راهنمای کاربردی همسایه‌بان',`<div class="v2-guide"><p class="notice">مطالب را به ترتیب بخوانید و بعد در ساختمان آزمایشی تمرین کنید. ثبت‌ها در نسخه آفلاین روی همین دستگاه می‌مانند.</p>${GUIDE.map(([title,txt],i)=>`<details ${i===0?'open':''}><summary>${num(i+1)}. ${title}</summary><p>${txt}</p></details>`).join('')}</div>`);}
function collectionPanel(){const units=b().units.filter(u=>rowPosition(u).debt>0);const options=units.map(u=>`<option value="${esc(u.id)}" ${ui.collectUnitId===u.id?'selected':''}>${esc(unitLabel(u))} — ${toman(rowPosition(u).debt)}</option>`).join('');return `<div class="grid two-col"><section class="card"><h3 class="section-title">📥 دریافت بدهی از ساکن</h3><p class="help">این فرم فقط دریافت از واحد بدهکار را ثبت می‌کند. مبلغ از بدهی واحد کم و به موجودی صندوق اضافه می‌شود.</p>${units.length?`<form id="collection-form" class="form-grid">${selector('واحد بدهکار','unitId',options)}${field('مبلغ دریافتی (ریال)','amount','number','','required')}${field('تاریخ دریافت (شمسی)','date','date',today(),'required')}${selector('روش دریافت','method','<option>کارت‌خوان</option><option>کارت به کارت</option><option>واریز بانکی</option><option>نقدی</option>')}<div class="field full"><label>تصویر رسید (اختیاری)</label><input type="file" name="receipt" accept="image/*"></div><button class="btn green full">ثبت دریافت بدهی</button></form>`:'<div class="notice">اکنون هیچ واحد بدهکاری وجود ندارد.</div>'}</section><section class="card"><h3 class="section-title">بدهکاران فعلی</h3>${units.map(u=>`<div class="v2-row"><span>${esc(unitLabel(u))}</span><strong class="debt">${toman(rowPosition(u).debt)}</strong></div>`).join('')||'<p class="help">همه واحدها تسویه هستند.</p>'}<div class="notice">ثبت پرداخت تکراری ممنوع است. قبل از ذخیره، فیش و تاریخ را بررسی کنید.</div></section></div>`;}
function settlementPanel(){const id=ui.collectUnitId||b().units[0]?.id,u=b().units.find(x=>x.id===id)||b().units[0];if(!u)return '<div class="card">ابتدا واحد تعریف کنید.</div>';const x=rowPosition(u),set=(b().settlements||[]).filter(t=>t.unitId===u.id).slice().reverse();return `<div class="stack"><section class="card"><h3 class="section-title">✅ تسویه حساب نهایی واحد</h3><div class="v2-row"><label>واحد را انتخاب کنید</label><select id="settlement-unit" class="search">${b().units.map(a=>`<option value="${esc(a.id)}" ${a.id===u.id?'selected':''}>${esc(unitLabel(a))}</option>`).join('')}</select></div><div class="grid metrics">${metric('بدهی جاری',toman(x.debt),'📌','debt')}${metric('بستانکاری',toman(x.credit),'✅','credit')}${metric('مانده',x.settled?'تسویه':'باز','📋')}</div>${!x.settled?`<div class="notice warn">برای تسویه نهایی، ابتدا ${x.debt?'بدهی '+toman(x.debt)+' را دریافت کنید': 'بستانکاری '+toman(x.credit)+' را مسترد کنید'}. هیچ تراکنشی خودکار حذف نمی‌شود.</div><button class="btn" data-action="goto-finance" data-tab="${x.debt?'collections':'income'}" data-unit="${esc(u.id)}">رفتن به ثبت ${x.debt?'دریافت بدهی':'استرداد بستانکاری'}</button>`:`<form id="settlement-form" class="form-grid"><input type="hidden" name="unitId" value="${esc(u.id)}">${field('تاریخ تسویه شمسی','date','date',today(),'required')}${field('توضیح تحویل واحد','note','text','','placeholder="مثلاً پایان اجاره و تحویل کلید"')}<button class="btn green full">ثبت تسویه حساب نهایی</button></form>`}</section><section class="card"><h3 class="section-title">سوابق تسویه همین واحد</h3>${set.map(t=>`<div class="v2-row"><span>${persianDate(t.date)} — ${esc(t.note||'تسویه نهایی')}</span><span class="badge good">تسویه ثبت شده</span></div>`).join('')||'<p class="help">هنوز تسویه نهایی برای این واحد ثبت نشده است.</p>'}<button class="btn" data-action="export-unit" data-id="${esc(u.id)}">دریافت دفتر حساب واحد</button></section></div>`;}
function showTicketDetail(id){const ticket=b().tickets.find(t=>t.id===id);if(!ticket)throw Error('درخواست پیدا نشد.');const unit=b().units.find(u=>u.id===ticket.unitId);const notes=ticket.notes||[];showModal('پیگیری: '+ticket.title,`<div class="v2-guide"><p class="notice">واحد: ${unit?esc(unit.number):'مشاعات'} • ثبت: ${persianDate(ticket.date)} • وضعیت: <strong>${esc(ticket.status)}</strong></p><p>${esc(ticket.body)}</p><h4>تاریخچه توضیحات و اقدامات</h4>${notes.map(note=>`<div class="v2-comment"><b>${esc(note.by)} • ${persianDate(note.date)} — ${esc(note.status||'توضیح')}</b><p>${esc(note.text)}</p></div>`).join('')||'<div class="notice">هنوز توضیح تکمیلی درج نشده است.</div>'}<form id="ticket-note-form" class="form-grid"><input type="hidden" name="ticketId" value="${esc(id)}">${ui.role==='manager'?selector('وضعیت درخواست','status',['ثبت شده','در حال پیگیری','ارجاع به پیمانکار','حل شد'].map(k=>`<option ${ticket.status===k?'selected':''}>${k}</option>`).join('')):''}<div class="field full"><label>${ui.role==='manager'?'توضیح اقدامات مدیر':'پاسخ یا توضیح ساکن'}</label><textarea name="note" required minlength="3" placeholder="توضیح روشن و قابل پیگیری وارد کنید."></textarea></div><button class="btn primary full">ثبت توضیح و ذخیره در تاریخچه</button></form></div>`);}
async function pinDigest(pin,salt){if(!crypto?.subtle)throw Error('قابلیت رمزنگاری امن در این دستگاه موجود نیست؛ رمز فعال نشد.');const bytes=new TextEncoder().encode(salt+'|'+localeDigits(pin));const hash=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('');}
let pinLocked=!!prefs.pinHash;
function lockScreen(){if(!pinLocked)return;let gate=document.getElementById('v2-lock');if(gate)return;gate=document.createElement('div');gate.id='v2-lock';gate.innerHTML=`<form id="unlock-form" class="v2-lock-card"><h2>🔐 همسایه‌بان</h2><p>برای ورود، رمز این دستگاه را وارد کنید.</p><input type="password" name="unlock" inputmode="numeric" maxlength="8" autocomplete="off" required placeholder="رمز ورود"><button class="btn primary">بازکردن برنامه</button><p id="unlock-error" class="debt"></p></form>`;document.body.append(gate);}
const translations={en:{خانه:'Home',واحدها:'Units',مالی:'Finance',ارتباطات:'Community',گزارش‌ها:'Reports',تنظیمات:'Settings'},ar:{خانه:'الرئيسية',واحدها:'الوحدات',مالی:'المالية',ارتباطات:'التواصل',گزارش‌ها:'التقارير',تنظیمات:'الإعدادات'},tr:{خانه:'Ana Sayfa',واحدها:'Daireler',مالی:'Finans',ارتباطات:'İletişim',گزارش‌ها:'Raporlar',تنظیمات:'Ayarlar'}};
function decorateUi(){const app=document.getElementById('app');if(!app)return;app.querySelectorAll('.sidebar .nav button,.bottom-nav button').forEach(el=>{const dict=translations[prefs.language]||{},key=el.dataset.page,fa={home:'خانه',units:'واحدها',finance:'مالی',social:'ارتباطات',reports:'گزارش‌ها',settings:'تنظیمات'}[key];const icon=el.querySelector('.ico');if(icon){const text=[...el.childNodes].find(n=>n.nodeType===Node.TEXT_NODE);if(text)text.textContent=dict[fa]||fa;}});const walk=document.createTreeWalker(app,NodeFilter.SHOW_TEXT);const nodes=[];while(walk.nextNode())nodes.push(walk.currentNode);nodes.forEach(n=>{const parent=n.parentElement;if(parent?.closest('script,style,textarea,input,option'))return;n.nodeValue=fDigits(n.nodeValue.replace(/(?<![0-9۰-۹])([0-9]{1,3})(?:,([0-9]{3}))+\b/g,m=>m.replaceAll(',','٬')));});lockScreen();}
// Click actions not present in the old app.
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;try{switch(el.dataset.action){
 case 'theme-select':prefs.theme=el.dataset.value;savePrefs();render();break;
 case 'language-select':prefs.language=el.dataset.value;savePrefs();render();break;
 case 'open-guide':showGuide();break;
 case 'biometric-help':toast(window.HamsayebanBridge?.biometricAvailable?'حسگر گوشی شناسایی شد؛ فعال‌سازی در نسخه بعد.':'اثر انگشت در این نسخه آفلاین هنوز به سیستم اندروید وصل نشده است.');break;
 case 'disable-pin':{if(!prefs.pinHash)return;const pin=prompt('برای حذف رمز، رمز فعلی را وارد کنید:');if(pin===null)return;if(await pinDigest(pin,prefs.pinSalt)!==prefs.pinHash)throw Error('رمز فعلی درست نیست.');delete prefs.pinHash;delete prefs.pinSalt;pinLocked=false;savePrefs();render();toast('رمز ورود این دستگاه حذف شد.');break;}
 }}catch(err){toast(err.message||'خطا در تنظیمات.');}});
// Additional form handlers: no fake buttons or dummy financial operations.
document.addEventListener('submit',async e=>{const form=e.target;if(!['collection-form','settlement-form','ticket-note-form','pin-form','unlock-form'].includes(form.id))return;e.preventDefault();e.stopPropagation();try{
 if(form.id==='pin-form'){const a=localeDigits(input(form,'pin')),c=localeDigits(input(form,'confirmPin'));if(!/^\d{4,8}$/.test(a)||a!==c)throw Error('رمز باید ۴ تا ۸ رقم و با تکرار آن یکسان باشد.');if(prefs.pinHash)throw Error('برای تغییر رمز ابتدا رمز قبلی را حذف کنید.');const buf=new Uint8Array(16);crypto.getRandomValues(buf);const salt=Array.from(buf,x=>x.toString(16).padStart(2,'0')).join('');prefs.pinHash=await pinDigest(a,salt);prefs.pinSalt=salt;savePrefs();pinLocked=false;toast('رمز ورود ذخیره شد؛ هنگام اجرای بعدی درخواست می‌شود.');render();return;}
 if(form.id==='unlock-form'){const hash=await pinDigest(input(form,'unlock'),prefs.pinSalt);if(hash!==prefs.pinHash){document.getElementById('unlock-error').textContent='رمز نادرست است.';return;}pinLocked=false;document.getElementById('v2-lock')?.remove();return;}
 if(pinLocked)throw Error('ابتدا رمز برنامه را وارد کنید.');
 if(form.id==='ticket-note-form'){const t=b().tickets.find(t=>t.id===input(form,'ticketId'));if(!t)throw Error('درخواست یافت نشد.');t.notes||=[];const status=ui.role==='manager'?String(input(form,'status')):t.status;const txt=String(input(form,'note')).trim();if(txt.length<3)throw Error('توضیح حداقل ۳ حرف باشد.');t.status=status;t.notes.push({id:uid(),date:today(),status,by:ui.role==='manager'?'مدیر':'ساکن',text:txt});save();ui.modal=null;render();toast('توضیح و وضعیت ذخیره شد.');return;}
 if(ui.role!=='manager')throw Error('عملیات مالی فقط برای مدیر است.');
 if(form.id==='collection-form'){const id=String(input(form,'unitId')),unit=b().units.find(u=>u.id===id);if(!unit)throw Error('واحد مشخص نشده است.');const amt=toSafeAmount(input(form,'amount')),debt=rowPosition(unit).debt;if(amt>debt)throw Error('برای اضافه‌پرداخت از فرم ثبت پرداخت استفاده کنید؛ مبلغ دریافتی از بدهی بیشتر است.');const receipt=await readReceipt(form);const pos=receivePayment(id,amt,String(input(form,'date')),String(input(form,'method')),receipt);save();render();toast('دریافت بدهی ثبت شد؛ باقیمانده: '+toman(pos.debt));return;}
 if(form.id==='settlement-form'){const id=String(input(form,'unitId')),unit=b().units.find(u=>u.id===id);if(!unit)throw Error('واحد یافت نشد.');const date=String(input(form,'date'));guardOpen(date);const p=rowPosition(unit);if(!p.settled)throw Error('برای تسویه نهایی ابتدا بدهی یا بستانکاری را صفر کنید.');b().settlements||=[];b().settlements.push({id:uid(),unitId:id,date,note:String(input(form,'note')).trim()});save();render();toast('تسویه حساب نهایی ثبت شد.');return;}
 }catch(err){toast(err.message||'عملیات انجام نشد.');}},true);
document.addEventListener('change',e=>{if(e.target.id==='settlement-unit'){ui.collectUnitId=e.target.value;render();}});

// Role switch remains an on-device preview, not server authorization.
ui.residentUnitId=b().units[0]?.id;
render();
})();

</script>
