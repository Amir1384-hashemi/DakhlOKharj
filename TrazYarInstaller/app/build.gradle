plugins { id 'com.android.application' }
android {
  namespace 'com.trazyar.level'
  compileSdk 35
  defaultConfig {
    applicationId 'com.trazyar.level'
    minSdk 26
    targetSdk 34
    versionCode 21
    versionName '4.1'
  }
  buildTypes {
    release {
      minifyEnabled false
      // Intentionally unsigned by CI. Sign locally with the owner's PRIVATE key.
      // Never commit a keystore or a signing password to source control.
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
